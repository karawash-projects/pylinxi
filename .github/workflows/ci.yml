name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check pylinxi tests examples
      - run: mypy pylinxi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pylinxi
          POSTGRES_PASSWORD: pylinxi
          POSTGRES_DB: pylinxi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pylinxi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYLINXI_PG_DSN: postgresql://pylinxi:pylinxi@localhost:5432/pylinxi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: core tests with zero dependencies
        run: python -W error::ResourceWarning -m unittest tests.test_core tests.test_features tests.test_cli tests.test_worker
      - run: pip install -e ".[dev]"
      - name: full suite (Postgres + OpenTelemetry)
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .
      - run: python examples/support_agent.py && python examples/followup_agent.py

  compat:
    # journals written by the previous release must load, verify and resume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: write journals with pylinxi 1.0.0 from PyPI
        run: |
          python -m venv /tmp/prev && /tmp/prev/bin/pip install "pylinxi==1.0.0"
          mkdir -p /tmp/journals && cd /tmp && /tmp/prev/bin/python $GITHUB_WORKSPACE/tests/compat/write_journals.py /tmp/journals
      - name: read them with this version
        run: PYTHONPATH=$GITHUB_WORKSPACE python tests/compat/read_journals.py /tmp/journals

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, compat]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
