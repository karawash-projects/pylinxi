site_name: pylinxi
site_description: Durable, self-healing agent flows written as plain Python.
site_url: https://karawash-projects.github.io/pylinxi/
repo_url: https://github.com/karawash-projects/pylinxi
repo_name: karawash-projects/pylinxi
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Concepts: concepts.md
      - Self-healing: self-healing.md
      - Flow API: flow-api.md
      - Durable waits & signals: durable-waits.md
      - Journals: journals.md
  - Operations:
      - Going to production: production.md
      - Security & audit: security.md
      - Command line: cli.md
      - Upgrading from 1.0: upgrading.md
  - Examples: examples.md
  - API reference: api.md
  - More:
      - pylinxi and LangGraph: comparison.md
      - Development: contributing.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.snippets: {check_paths: true}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
