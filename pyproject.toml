[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pylinxi"
version = "1.1.1"
description = "Durable, self-healing agent flows as plain Python. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["agents", "llm", "workflow", "durable-execution", "ai-agents", "self-healing", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://karawash-projects.github.io/pylinxi/"
Homepage = "https://github.com/karawash-projects/pylinxi"
Repository = "https://github.com/karawash-projects/pylinxi"
Issues = "https://github.com/karawash-projects/pylinxi/issues"
Changelog = "https://github.com/karawash-projects/pylinxi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
otel = ["opentelemetry-api>=1.20"]
dev = ["psycopg[binary]>=3.1", "opentelemetry-sdk>=1.20", "ruff>=0.5", "mypy>=1.10", "build"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26"]

[project.scripts]
pylinxi = "pylinxi.cli:main"

[tool.setuptools]
packages = ["pylinxi"]

[tool.setuptools.package-data]
pylinxi = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["UP006", "UP007", "UP035", "UP045", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
